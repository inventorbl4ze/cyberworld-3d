
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBERWORLD 3D</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  overflow: hidden;
  background: #101827;
  font-family: Arial, sans-serif;
}

#hud {
  position: fixed;
  top: 15px;
  left: 15px;
  z-index: 5;
  color: white;
  background: #071526dd;
  padding: 12px 16px;
  border: 1px solid #00bfff;
  border-radius: 12px;
}

#hud h2 {
  margin: 0 0 5px;
  color: #00c8ff;
}

#controls {
  position: fixed;
  bottom: 25px;
  left: 20px;
  z-index: 5;
  display: flex;
  gap: 10px;
}

#actions {
  position: fixed;
  bottom: 25px;
  right: 20px;
  z-index: 5;
}

button {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  border: 2px solid #00c8ff;
  background: #071526dd;
  color: white;
  font-size: 23px;
  touch-action: none;
}

button:active {
  background: #007fa8;
}

#message {
  position: fixed;
  top: 100px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  background: #071526dd;
  padding: 10px;
  border-radius: 8px;
  z-index: 5;
}
</style>
</head>

<body>

<div id="hud">
  <h2>CYBERWORLD 3D</h2>
  <div>Player: Explorer</div>
  <div>Money: $500</div>
  <div id="position">Location: City</div>
</div>
<div id="money" style="
  position:fixed;
  top:15px;
  right:15px;
  background:#071a33;
  color:#00ff99;
  padding:12px 18px;
  border:2px solid #00ccff;
  border-radius:10px;
  font-size:20px;
  font-weight:bold;
  z-index:100;
">
  💰 Money: $500
</div>
<div id="message">Welcome to CYBERWORLD!</div>

<div id="controls">
  <button id="left">←</button>
  <button id="forward">↑</button>
  <button id="backward">↓</button>
  <button id="right">→</button>
</div>

<div id="actions">
  <button id="jump">↑</button>
</div>

<script type="module">
import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 35, 150);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  300
);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x536477, 2));

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(30, 50, 20);
sun.castShadow = true;
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x478b4b })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Roads
function makeRoad(x, z, width, depth) {
  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(width, depth),
    new THREE.MeshStandardMaterial({ color: 0x333941 })
  );
  road.rotation.x = -Math.PI / 2;
  road.position.set(x, 0.02, z);
  scene.add(road);
}

makeRoad(0, 0, 200, 12);
makeRoad(0, 0, 12, 200);

// Road markings
for (let i = -90; i <= 90; i += 12) {
  const mark = new THREE.Mesh(
    new THREE.BoxGeometry(5, 0.04, 0.25),
    new THREE.MeshStandardMaterial({ color: 0xffffff })
  );
  mark.position.set(i, 0.06, 0);
  scene.add(mark);
}

// Buildings
const buildings = [];

function makeBuilding(x, z, width, height, depth, color) {
  const building = new THREE.Mesh(
    new THREE.BoxGeometry(width, height, depth),
    new THREE.MeshStandardMaterial({ color })
  );

  building.position.set(x, height / 2, z);
  building.castShadow = true;
  building.receiveShadow = true;
  scene.add(building);
  buildings.push(building);
}

for (let x = -45; x <= 45; x += 20) {
  for (let z = -45; z <= 45; z += 20) {
    if (Math.abs(x) < 15 || Math.abs(z) < 15) continue;

    const height = 8 + Math.random() * 18;

    makeBuilding(
      x,
      z,
      10,
      height,
      10,
      new THREE.Color().setHSL(Math.random(), 0.35, 0.45)
    );
  }
}

// CITY DETAILS

// Trees
function makeTree(x, z) {
  const trunk = new THREE.Mesh(
    new THREE.CylinderGeometry(0.2, 0.3, 2, 8),
    new THREE.MeshStandardMaterial({ color: 0x70452a })
  );

  trunk.position.set(x, 1, z);
  trunk.castShadow = true;
  scene.add(trunk);

  const leaves = new THREE.Mesh(
    new THREE.SphereGeometry(1.4, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0x167a38 })
  );

  leaves.position.set(x, 2.7, z);
  leaves.castShadow = true;
  scene.add(leaves);
}

// Plant trees along the roads
for (let i = -45; i <= 45; i += 15) {
  makeTree(i, -9);
  makeTree(i, 9);
  makeTree(-9, i);
  makeTree(9, i);
}

// Streetlights
function makeStreetlight(x, z) {
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.08, 0.08, 5, 8),
    new THREE.MeshStandardMaterial({ color: 0x333333 })
  );

  pole.position.set(x, 2.5, z);
  scene.add(pole);

  const lamp = new THREE.Mesh(
    new THREE.SphereGeometry(0.3, 12, 12),
    new THREE.MeshStandardMaterial({
      color: 0xffee99,
      emissive: 0xffaa33,
      emissiveIntensity: 2
    })
  );

  lamp.position.set(x, 5, z);
  scene.add(lamp);
}

for (let i = -40; i <= 40; i += 20) {
  makeStreetlight(i, -7);
  makeStreetlight(i, 7);
}

// Building windows
function makeWindows(building) {
  const position = building.position;
  const width = building.geometry.parameters.width;
  const height = building.geometry.parameters.height;
  const depth = building.geometry.parameters.depth;

  for (let y = 2; y < height - 1; y += 3) {
    for (let x = -width / 2 + 2; x < width / 2; x += 3) {
      const windowMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(1.1, 1.4),
        new THREE.MeshStandardMaterial({
          color: 0x8eeaff,
          emissive: 0x164e70,
          emissiveIntensity: 0.6
        })
      );

      windowMesh.position.set(
        position.x + x,
        y,
        position.z + depth / 2 + 0.02
      );

      scene.add(windowMesh);
    }
  }
}

buildings.forEach(makeWindows);
  // MONEY SYSTEM
let money = 500;

function updateMoney() {
  document.getElementById("money").textContent =
    "💰 Money: $" + money;
  }
 // CAR SYSTEM

const car = new THREE.Group();

// Main red body
const carBody = new THREE.Mesh(
  new THREE.BoxGeometry(2.2, 0.8, 4),
  new THREE.MeshStandardMaterial({
    color: 0xff2020,
    metalness: 0.4,
    roughness: 0.3
  })
);
carBody.position.y = 0.9;
carBody.castShadow = true;
car.add(carBody);

// Car roof
const carRoof = new THREE.Mesh(
  new THREE.BoxGeometry(1.7, 0.8, 2),
  new THREE.MeshStandardMaterial({ color: 0x172333 })
);
carRoof.position.set(0, 1.65, -0.2);
car.add(carRoof);

// Wheels
const wheels = [];

for (const x of [-1.15, 1.15]) {
  for (const z of [-1.3, 1.3]) {
    const wheel = new THREE.Mesh(
      new THREE.CylinderGeometry(0.42, 0.42, 0.3, 20),
      new THREE.MeshStandardMaterial({ color: 0x111111 })
    );

    wheel.rotation.z = Math.PI / 2;
    wheel.position.set(x, 0.45, z);
    car.add(wheel);
    wheels.push(wheel);
  }
}

// Headlights
for (const x of [-0.7, 0.7]) {
  const light = new THREE.Mesh(
    new THREE.BoxGeometry(0.4, 0.2, 0.1),
    new THREE.MeshStandardMaterial({
      color: 0xffffcc,
      emissive: 0xffff88,
      emissiveIntensity: 1
    })
  );

  light.position.set(x, 0.95, -2.02);
  car.add(light);
}

// Place car near the starting player
car.position.set(0, 0, 1);
car.scale.set(1.5, 1.5, 1.5);
scene.add(car);

// Driving state
let driving = false;
let carSpeed = 0;

// Enter and exit button
const enterCarButton = document.createElement("button");
enterCarButton.textContent = "🚗";
enterCarButton.style.cssText =
  "position:fixed;right:20px;bottom:100px;z-index:10;width:65px;height:65px;";
document.body.appendChild(enterCarButton);

enterCarButton.addEventListener("click", () => {
  const distance = player.position.distanceTo(car.position);

  if (distance < 5 || driving) {
    driving = !driving;
    carSpeed = 0;

    if (driving) {
      player.visible = false;
      player.position.copy(car.position);
    } else {
      player.visible = true;
      player.position.set(
        car.position.x + 3,
        0,
        car.position.z
      );
    }

    enterCarButton.textContent = driving ? "🚶" : "🚗";

    document.getElementById("message").textContent =
      driving ? "You entered the car!" : "You left the car!";
  } else {
    document.getElementById("message").textContent =
      "Move closer to the car first!";
  }
});
// BRAKE BUTTON
const brakeButton = document.createElement("button");
brakeButton.textContent = "🛑";
brakeButton.style.cssText =
  "position:fixed;right:20px;bottom:180px;z-index:10;width:65px;height:65px;";
document.body.appendChild(brakeButton);

brakeButton.addEventListener("click", () => {
  if (driving) {
    carSpeed = 0;
    document.getElementById("message").textContent = "Car stopped!";
  }
});
    enterCarButton.textContent = driving ? "🚶" : "🚗";

    document.getElementById("message").textContent =
      driving ? "You entered the car!" : "You left the car!";
  } else {
    document.getElementById("message").textContent =
      "Move closer to the car first!";
  }
});
  
// Player
const player = new THREE.Group();

const body = new THREE.Mesh(
  new THREE.BoxGeometry(0.9, 1.4, 0.5),
  new THREE.MeshStandardMaterial({ color: 0x00bfff })
);
body.position.y = 1.2;
body.castShadow = true;
player.add(body);

const head = new THREE.Mesh(
  new THREE.SphereGeometry(0.38, 20, 20),
  new THREE.MeshStandardMaterial({ color: 0xffcc99 })
);
head.position.y = 2.15;
player.add(head);

scene.add(player);
player.position.set(0, 0, 5);

// Controls
const keys = {};

function bindButton(id, key) {
  const button = document.getElementById(id);

  button.addEventListener("pointerdown", event => {
    event.preventDefault();
    keys[key] = true;
    button.setPointerCapture(event.pointerId);
  });

  function release(event) {
    keys[key] = false;
  }

  button.addEventListener("pointerup", release);
  button.addEventListener("pointercancel", release);
  button.addEventListener("lostpointercapture", release);
}

bindButton("forward", "forward");
bindButton("backward", "backward");
bindButton("left", "left");
bindButton("right", "right");

let verticalSpeed = 0;
let grounded = true;

document.getElementById("jump").addEventListener("pointerdown", () => {
  if (grounded) {
    verticalSpeed = 0.18;
    grounded = false;
  }
});

// Keyboard controls
window.addEventListener("keydown", event => {
  if (event.key === "w" || event.key === "ArrowUp") keys.forward = true;
  if (event.key === "s" || event.key === "ArrowDown") keys.backward = true;
  if (event.key === "a" || event.key === "ArrowLeft") keys.left = true;
  if (event.key === "d" || event.key === "ArrowRight") keys.right = true;

  if (event.code === "Space" && grounded) {
    verticalSpeed = 0.18;
    grounded = false;
  }
});

window.addEventListener("keyup", event => {
  if (["w", "ArrowUp"].includes(event.key)) keys.forward = false;
  if (["s", "ArrowDown"].includes(event.key)) keys.backward = false;
  if (["a", "ArrowLeft"].includes(event.key)) keys.left = false;
  if (["d", "ArrowRight"].includes(event.key)) keys.right = false;
});

// Camera and game loop

// Third-person movement and camera
const clock = new THREE.Clock();

const cameraOffset = new THREE.Vector3(0, 6, 10);
const desiredCameraPosition = new THREE.Vector3();

function animate() {
  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);
  const moveSpeed = 9 * delta;

  
  
let moveX = 0;
let moveZ = 0;

if (driving) {
  // Accelerate and reverse
  if (keys.forward) {
    carSpeed = Math.min(carSpeed + 15 * delta, 22);
  } else if (keys.backward) {
    carSpeed = Math.max(carSpeed - 15 * delta, -8);
  } else {
    carSpeed *= Math.pow(0.96, delta * 60);
  }

  // Steering
  if (keys.left) {
    car.rotation.y += 1.8 * delta;
  }

  if (keys.right) {
    car.rotation.y -= 1.8 * delta;
  }

  // Move car
  car.position.x -= Math.sin(car.rotation.y) * carSpeed * delta;
  car.position.z -= Math.cos(car.rotation.y) * carSpeed * delta;

  // City boundaries
  car.position.x = THREE.MathUtils.clamp(car.position.x, -90, 90);
  car.position.z = THREE.MathUtils.clamp(car.position.z, -90, 90);

  // Rotate wheels
  wheels.forEach(wheel => {
    wheel.rotation.x += carSpeed * delta;
  });

  // Attach player to car
  player.position.copy(car.position);
  player.rotation.y = car.rotation.y;

} else {
  // Walking controls
  if (keys.forward) moveZ -= 1;
  if (keys.backward) moveZ += 1;
  if (keys.left) moveX -= 1;
  if (keys.right) moveX += 1;

  const moving = moveX !== 0 || moveZ !== 0;

  if (moving) {
    const length = Math.hypot(moveX, moveZ);
    moveX /= length;
    moveZ /= length;

    player.position.x += moveX * moveSpeed;
    player.position.z += moveZ * moveSpeed;

    player.rotation.y = Math.atan2(moveX, moveZ);
  }
  }
                       
  // Jump physics
  player.position.y += verticalSpeed;
  verticalSpeed -= 0.45 * delta;

  if (player.position.y <= 0) {
    player.position.y = 0;
    verticalSpeed = 0;
    grounded = true;
  }

  // Smooth third-person camera
  desiredCameraPosition.set(
    player.position.x + cameraOffset.x,
    player.position.y + cameraOffset.y,
    player.position.z + cameraOffset.z
  );

  camera.position.lerp(desiredCameraPosition, 1 - Math.exp(-5 * delta));

  camera.lookAt(
    player.position.x,
    player.position.y + 1.3,
    player.position.z
  );

  document.getElementById("position").textContent =
    "Location: " +
    Math.round(player.position.x) + ", " +
    Math.round(player.position.z);

  renderer.render(scene, camera);
}
// JOB SYSTEM
const jobButton = document.createElement("button");
jobButton.textContent = "💼 Work";
jobButton.style.cssText =
  "position:fixed;left:20px;top:100px;z-index:100;padding:14px;background:#071a33;color:#00ffcc;border:2px solid #00ccff;border-radius:10px;font-size:18px;";

document.body.appendChild(jobButton);

jobButton.addEventListener("click", () => {
  money += 100;
  updateMoney();
  document.getElementById("message").textContent =
    "Job completed! You earned $100.";
});
animate();
      

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
  </html>
